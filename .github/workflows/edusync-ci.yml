name: EduSync integration checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [integration/backend-into-dev, feature/counsellor-backend]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-publishable-key
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/scripts
      - name: Run counsellor schema tests
        env:
          PYTHONPATH: backend
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: example-publishable-key
        run: python -m unittest discover -s backend/tests -v

  postgres-migrations:
    name: PostgreSQL counsellor migration smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edusync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edusync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Bootstrap Supabase auth scaffolding
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f backend/tests/sql/bootstrap_counsellor_migrations.sql
      - name: Apply recovered canonical baseline migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in backend/schema_snapshots/20261113*.sql; do
            echo "Applying canonical baseline $migration"
            psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Apply existing backend migrations after the baseline
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in backend/migrations/20261113*.sql; do
            echo "Applying backend migration $migration"
            psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Apply counsellor migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in backend/migrations/20261114*.sql; do
            echo "Applying counsellor migration $migration"
            psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert migrated schema, RLS and lifecycle triggers
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f backend/tests/sql/verify_counsellor_migrations.sql
      - name: Run multi-school RLS and Student Voice revocation tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d edusync_test -v ON_ERROR_STOP=1 -f backend/tests/sql/test_counsellor_rls_behaviour.sql
