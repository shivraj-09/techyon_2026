name: EduSync integration checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [integration/backend-into-dev, feature/counsellor-backend]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: example-publishable-key
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Run counsellor schema tests
        env:
          PYTHONPATH: backend
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: example-publishable-key
        run: python -m unittest discover -s backend/tests -v
